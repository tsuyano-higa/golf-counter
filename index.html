<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golf Counter</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <!-- ラウンド設定画面 -->
<section id="round-setup-screen" class="screen">
  <h1 class="setup-title">GOLF COUNTER</h1>

  <div class="setup-field">
    <p class="setup-label">日付</p>
    <p id="round-date" class="date-display"></p>
  </div>

  <div class="setup-field">
    <label class="setup-label" for="course-name">
      コース名
    </label>

    <input
      id="course-name"
      class="course-input"
      type="text"
      placeholder="例：○○ゴルフクラブ"
      autocomplete="off"
    >
  </div>

  <fieldset class="setup-field hole-count-field">
    <legend class="setup-label">ラウンド</legend>

    <div class="hole-options">
      <label class="hole-option">
        <input type="radio" name="hole-count" value="9">
        <span>9 HOLE</span>
      </label>

      <label class="hole-option">
        <input type="radio" name="hole-count" value="18" checked>
        <span>18 HOLE</span>
      </label>
    </div>
  </fieldset>

  <button
    id="next-from-round-setup"
    class="setup-next-button"
    type="button"
    disabled
  >
    次へ
  </button>
</section>

<!-- PAR設定画面 -->
<section id="par-setup-screen" class="screen" hidden>
  <div class="par-setup-header">
    <button
      id="back-to-round-setup"
      class="header-button"
      type="button"
      aria-label="ラウンド設定へ戻る"
    >
      ←
    </button>

    <h1>PAR設定</h1>

    <span aria-hidden="true"></span>
  </div>

  <p class="par-setup-description">
    各HoleのPARを選択してください
  </p>

  <div id="par-settings-list" class="par-settings-list"></div>

  <button id="start-round" class="primary-button" type="button">
    ラウンド開始
  </button>
</section>


    <!-- プレー画面 -->
    <section id="play-screen" class="screen"hidden>
      <div class="screen-header">
        <h1>GOLF COUNTER</h1>

        <button id="open-score-list" class="header-button" type="button">
          SCORE一覧
        </button>
      </div>

      <div class="hole-information">
        <p class="hole-number">
          HOLE <span id="hole-number">1</span>
        </p>

        <p class="par">
          PAR <span id="par-number">4</span>
        </p>
      </div>

      <div class="count-area">
        <p class="count-label">打数</p>
        <p class="count-display">
          <span id="stroke-count">0</span>
          <span class="unit">打</span>
        </p>
      </div>

      <div class="count-area">
        <p class="count-label">PUTT</p>
        <p class="count-display">
          <span id="putt-count">0</span>
          <span class="unit">PUTT</span>
        </p>
      </div>

      <div class="button-group">
        <button id="add-stroke" class="primary-button" type="button">
          ＋1打
        </button>

        <button id="subtract-stroke" class="secondary-button" type="button" disabled>
          −1打
        </button>
      </div>

      <div class="button-group">
        <button id="add-putt" class="putt-button" type="button">
          ＋1 PUTT
        </button>

        <button id="subtract-putt" class="secondary-putt-button" type="button" disabled>
          −1 PUTT
        </button>
      </div>

      <button id="finish-hole" class="finish-button" type="button" disabled>
        ホール終了
      </button>
    </section>

    <!-- ホール結果画面 -->
    <section id="result-screen" class="screen" hidden>
      <h1>
        HOLE <span id="result-hole-number">1</span>
      </h1>

      <div class="result-content">
        <p class="result-par">
          PAR <span id="result-par-number">4</span>
        </p>

        <p class="result-number">
          <span id="result-strokes">0</span>打
        </p>

        <p class="result-putts">
          <span id="result-putts">0</span> PUTT
        </p>

        <div class="result-score-area">
          <p>SCORE</p>
          <p id="result-score" class="result-score">±0</p>
        </div>
      </div>

      <div class="result-actions">
        <button id="next-hole" class="next-hole-button" type="button">
          次のホールへ
        </button>

        <button id="back-to-play" class="secondary-button" type="button">
          入力画面へ戻る
        </button>
      </div>
    </section>

    <!-- スコア一覧画面 -->
    <section id="score-list-screen" class="screen" hidden>
      <div class="screen-header">
        <h1>SCORE一覧</h1>

        <button id="toggle-score-edit" class="header-button" type="button">
          編集
        </button>
      </div>

      <p id="score-course-name" class="score-course-name"></p>

      <p id="edit-instruction" class="edit-instruction" hidden>
        編集するHoleを選択してください
      </p>

      <div id="score-list" class="score-list"></div>

      <div class="score-summary">
        <div class="summary-row">
          <span>TOTAL</span>
          <strong id="total-strokes">0</strong>
        </div>

        <div class="summary-row">
          <span>SCORE</span>
          <strong id="total-score">±0</strong>
        </div>

        <div class="summary-row">
          <span>PUTT</span>
          <strong id="total-putts">0</strong>
        </div>
      </div>

      <button id="back-to-current-hole" class="primary-button" type="button">
        プレー画面へ戻る
      </button>
    </section>

    <!-- Hole編集画面 -->
    <section id="hole-edit-screen" class="screen" hidden>
      <h1>
        Hole <span id="edit-hole-number">1</span> 編集
      </h1>

      <p class="result-par">
        PAR <span id="edit-par-number">4</span>
      </p>

      <div class="edit-section">
        <p class="edit-label">打数</p>

        <div class="edit-control">
          <button id="subtract-edit-stroke" type="button">−</button>
          <strong id="edit-strokes" class="edit-value">0</strong>
          <button id="add-edit-stroke" type="button">＋</button>
        </div>
      </div>

      <div class="edit-section">
        <p class="edit-label">PUTT</p>

        <div class="edit-control">
          <button id="subtract-edit-putt" type="button">−</button>
          <strong id="edit-putts" class="edit-value">0</strong>
          <button id="add-edit-putt" type="button">＋</button>
        </div>
      </div>

      <div class="edit-score-area">
        <span>SCORE</span>
        <strong id="edit-score">±0</strong>
      </div>

      <div class="edit-actions">
        <button id="save-hole-edit" class="primary-button" type="button">
          保存
        </button>

        <button id="cancel-hole-edit" class="secondary-button" type="button">
          キャンセル
        </button>
      </div>
    </section>
  </main>
</body>
</html>
